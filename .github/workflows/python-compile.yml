name: python-compile
on:
  push:
    branches: [main, feature/github-download-analysis]
  pull_request:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q app tests
